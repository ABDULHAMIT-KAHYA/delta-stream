name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace
      - run: cargo check --workspace --features crdt
      - run: cargo check --workspace --all-features
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - run: cargo test --workspace --features crdt
      - run: cargo test --workspace --all-features
      - run: cargo doc --workspace --all-features --no-deps
      - run: cargo run --example basic_sync
      - run: cargo run --example recovery
      - run: cargo run --example crdt_counter --features crdt
      - run: cargo run --example crdt_register --features crdt
      - run: cargo bench --no-run
      - run: cargo bench --bench crdt --features crdt --no-run
      - run: cargo package -p delta-stream-derive --allow-dirty
      - run: cargo package -p delta-stream --allow-dirty --no-verify
      - run: cargo run --release -- --validate-v30

  feature-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - "crdt"
          - "pubnub-transport"
          - "websocket-transport"
          - "mqtt-transport"
          - "nats-transport"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --no-default-features --features ${{ matrix.features }}

  no-default-features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --workspace --no-default-features
