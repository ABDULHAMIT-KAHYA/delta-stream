[package]
name = "delta-stream-derive"
version = "0.31.0"
edition = "2021"
description = "Derive macro for DeltaStream state models"
documentation = "https://docs.rs/delta-stream-derive"
license = "MIT"
readme = "README.md"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[package.metadata.docs.rs]
all-features = true


